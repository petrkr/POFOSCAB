[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short

# Markers for conditional test runs
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    hardware: marks tests that require real Portfolio hardware
    mame: marks tests that require MAME backend
    no_pftd_required: exempts a test from the require_pftd autouse skip (test only needs the raw Portfolio link, not PFTD)
