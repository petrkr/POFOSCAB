name: Build PFTD.COM

on:
  push:
    branches: [master]
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Generate build_id.inc from git short hash
        working-directory: src/pftd
        run: |
          HASH=$(git rev-parse --short=8 HEAD)
          cat > build_id.inc <<EOF
          ; build_id.inc - CI-generated, see this file's committed
          ; version in git for the full explanation. This copy is
          ; overwritten wholesale by .github/workflows/build.yml, not
          ; patched - BUILD_ID here is the exact commit's short hash.

          BUILD_ID  equ 0x${HASH}
          EOF
          cat build_id.inc

      - name: Generate version.inc from tag (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: src/pftd
        run: |
          # GITHUB_REF_NAME is "vMAJOR.MINOR.PATCH" here (workflow only
          # triggers on tags matching v*.*.*, see the `on:` block above).
          VER="${GITHUB_REF_NAME#v}"
          MAJOR="${VER%%.*}"
          REST="${VER#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          cat > version.inc <<EOF
          ; version.inc - CI-generated, see this file's committed
          ; version in git for the full explanation. This copy is
          ; overwritten wholesale by .github/workflows/build.yml, not
          ; patched - only happens on a vMAJOR.MINOR.PATCH tag build
          ; (an ordinary push keeps the committed 0.0.0 default).

          VERSION_MAJOR equ ${MAJOR}
          VERSION_MINOR equ ${MINOR}
          VERSION_PATCH equ ${PATCH}
          EOF
          cat version.inc

      - name: Assemble PFTD.COM
        working-directory: src/pftd
        run: nasm -f bin PFTD.asm -o PFTD.COM

      - name: Determine build identifier
        id: ident
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "id=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "id=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PFTD-${{ steps.ident.outputs.id }}
          path: src/pftd/PFTD.COM

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: src/pftd
        run: zip "PFTD-${{ steps.ident.outputs.id }}.zip" PFTD.COM

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "src/pftd/PFTD-${{ steps.ident.outputs.id }}.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes
