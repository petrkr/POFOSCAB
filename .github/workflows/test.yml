name: Test PFTD (MAME)

on:
  push:
    branches: [citest, master]
    tags: ['pftd-v*.*.*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout POFOSCAB
        uses: actions/checkout@v4

      - name: Verify PFTD tag version
        if: github.ref_type == 'tag'
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^pftd-v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            TAG_VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag must start with pftd-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          SOURCE_VERSION=$(awk '
            $1 == "VERSION_MAJOR" { major = $3 }
            $1 == "VERSION_MINOR" { minor = $3 }
            $1 == "VERSION_PATCH" { patch = $3 }
            END {
              if (major == "" || minor == "" || patch == "")
                exit 1
              print major "." minor "." patch
            }
          ' src/pftd/version.inc)
          if [[ "${TAG_VERSION}" != "${SOURCE_VERSION}" ]]; then
            echo "::error::Tag version ${TAG_VERSION} differs from PFTD version ${SOURCE_VERSION}"
            exit 1
          fi

      - name: Checkout MAME fork
        uses: actions/checkout@v4
        with:
          repository: petrkr/mame-pofo
          ref: pofosmartcable
          path: mame

      - name: Get MAME fork SHA
        id: mame-sha
        working-directory: mame
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore pofo binary from cache
        id: cache-pofo
        uses: actions/cache/restore@v4
        with:
          path: mame/pofo
          key: mame-pofo-bin-${{ steps.mame-sha.outputs.sha }}

      - name: Fail if MAME binary isn't cached
        if: steps.cache-pofo.outputs.cache-hit != 'true'
        run: |
          echo "::error::No cached MAME binary for MAME fork SHA ${{ steps.mame-sha.outputs.sha }}. Run the 'Build MAME (pofo)' workflow for this MAME fork commit first."
          exit 1

      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libsdl2-ttf-2.0-0 libfontconfig1 libpulse0 libqt6core6 libqt6gui6 libqt6widgets6 libqt6dbus6 nasm

      - name: Download pofo ROM set
        working-directory: mame
        run: |
          mkdir -p roms/pofo
          wget -4 -q "https://mdk.cab/download/standalone/pofo.7z" -O /tmp/pofo.7z
          7z x -y -oroms/pofo /tmp/pofo.7z

      - name: Generate build_id.inc from git short hash
        working-directory: src/pftd
        run: |
          HASH=$(git rev-parse --short=8 HEAD)
          cat > build_id.inc <<EOF
          ; build_id.inc - CI-generated, see this file's committed
          ; version in git for the full explanation. This copy is
          ; overwritten wholesale by .github/workflows/test.yml, not
          ; patched - BUILD_ID here is the exact commit's short hash.

          BUILD_ID  equ 0x${HASH}
          EOF
          cat build_id.inc

      - name: Build PFTD.COM
        run: make pftd

      - name: Install pytest
        run: |
          sudo apt-get install -y python3-pytest
          pip install --break-system-packages pytest-html

      - name: Start MAME under -console with FIFOs
        run: |
          mkdir -p /tmp/fifodir
          mkfifo /tmp/fifodir/mame_in /tmp/fifodir/mame_out
          cd mame
          SDL_VIDEODRIVER=dummy ./pofo pofo -ccma ram -exp smartcable -console -video none \
            < /tmp/fifodir/mame_in > /tmp/fifodir/mame_out 2>&1 &
          echo "MAME_PID=$!" >> "$GITHUB_ENV"
          sleep 1

      - name: Start bridge
        run: |
          python3 tools/mame_bridge.py &
          echo "BRIDGE_PID=$!" >> "$GITHUB_ENV"

      - name: Run pytest
        env:
          MAME_DIR: /tmp/fifodir
          POFOSCAB_BRIDGE_URL: http://localhost:9000
          INITIAL: "1"
          FORMAT_A: "1"
          UPLOAD: "1"
          SERVER: "1"
          PFTD: "1"
        run: |
          cd tests
          python3 -m pytest -v --junitxml=junit.xml \
            --html=test-report.html --self-contained-html

      - name: Upload MAME artifacts (screenshots/vram dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mame-test-artifacts
          path: /tmp/fifodir/artifacts
          if-no-files-found: ignore

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: tests/junit.xml

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/test-report.html
          if-no-files-found: ignore

      - name: Stop MAME and bridge
        if: always()
        run: |
          kill "$MAME_PID" 2>/dev/null || true
          kill "$BRIDGE_PID" 2>/dev/null || true

      - name: Upload PFTD.COM artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: PFTD-COM
          path: build/PFTD.COM
